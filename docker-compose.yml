version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://crm_user:crm_password@postgres:5432/crm_os
      SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000
      HOST: 0.0.0.0
      PORT: "8001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
        REACT_APP_API_URL: http://localhost:8001
        REACT_APP_APP_PHASE: "2"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
